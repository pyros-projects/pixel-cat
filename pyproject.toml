[project]
name = "pixel-cat"
version = "0.6.6"
description = "Turn images, GIFs, videos and sprite sheets into pixel art from the command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<14",
]

[project.scripts]
pixel-cat = "pixel_cat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixel_cat"]
